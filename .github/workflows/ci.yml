name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  web:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database:
    name: Schema, constraints and RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Applies every migration to a real Postgres, then asserts the CHECK
      # constraints hold and that no user can read another user's rows.
      - name: Install Postgres 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
      - run: sudo bash scripts/db-test.sh
