<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Calendar-aware task tracker that tells you when to start."
    />
    <title>Mercury</title>
    <!-- Applied before first paint so a pinned dark theme never flashes light
         while the bundle loads. Deliberately duplicates the small amount of
         logic in src/lib/theme.ts, which cannot run this early; that module
         owns every other read and write, and its tests cover these same rules. -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('mercury.theme');
          if (v === 'light' || v === 'dark')
            document.documentElement.dataset.theme = v;
        } catch (e) {
          /* private browsing: fall through to the device preference */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
